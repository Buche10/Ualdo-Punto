services:
  pos-terminal:
    build:
      context: .
      dockerfile: Dockerfile.pos
    environment:
      - VITE_API_URL=https://api-sri.negocios.ualdocorp.com/api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  sri-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - SRI_AMBIENTE=${SRI_AMBIENTE:-1}
      - SRI_REQUIRE_DB=${SRI_REQUIRE_DB:-true}
      - SRI_RUC_EMISOR=${SRI_RUC_EMISOR}
      - SRI_P12_BASE64=${SRI_P12_BASE64}
      - SRI_P12_PASSWORD=${SRI_P12_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - POS_API_KEY=${POS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://pos.negocios.ualdocorp.com
      - SRI_QUEUE_INTERVAL_SEC=5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
